<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دستیار هوشمند طاها کریمی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:        #16211F;
    --ink-soft:   #46534F;
    --paper:      #F2F4F1;
    --panel:      #FFFFFF;
    --line:       #DDE3DE;
    --accent:     #2F7A62;
    --accent-ink: #EAF4EF;
    --amber:      #C98A2C;
    --user-bubble:#16211F;
    --user-text:  #F2F4F1;
    --radius:     14px;
    --font-fa:    'Vazirmatn', sans-serif;
    --font-mono:  'IBM Plex Mono', monospace;
  }

  *{ box-sizing: border-box; }

  html,body{
    height:100%;
    margin:0;
  }

  body{
    font-family: var(--font-fa);
    background: var(--paper);
    color: var(--ink);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  a{ color: var(--accent); }

  /* ---------- Header ---------- */

  header.top{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 20px;
    background: var(--panel);
    border-bottom:1px solid var(--line);
    position: sticky;
    top:0;
    z-index: 10;
  }

  .avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    background: var(--ink);
    color: var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:15px;
    flex-shrink:0;
  }

  .top-info{ display:flex; flex-direction:column; gap:2px; min-width:0; }

  .top-info h1{
    font-size:16px;
    font-weight:700;
    margin:0;
  }

  .status{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    color: var(--ink-soft);
  }

  .status .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background: var(--accent);
    flex-shrink:0;
  }

  .top-links{
    margin-inline-start:auto;
    display:flex;
    gap:10px;
  }

  .top-links a{
    width:36px;
    height:36px;
    border-radius:50%;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color: var(--ink-soft);
    transition: border-color .15s, color .15s;
  }

  .top-links a:hover,
  .top-links a:focus-visible{
    border-color: var(--accent);
    color: var(--accent);
  }

  .top-links svg{ width:17px; height:17px; }

  /* ---------- Chat area ---------- */

  main.chat-wrap{
    flex:1;
    display:flex;
    justify-content:center;
    overflow:hidden;
  }

  #chat{
    width:100%;
    max-width:720px;
    overflow-y:auto;
    padding:24px 20px 12px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .msg{
    max-width:80%;
    padding:11px 15px;
    border-radius: var(--radius);
    line-height:1.85;
    font-size:15px;
    white-space:pre-wrap;
    animation: rise .25s ease;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .msg.bot{
    align-self:flex-start;
    background: var(--panel);
    border:1px solid var(--line);
    border-start-start-radius:4px;
  }

  .msg.user{
    align-self:flex-end;
    background: var(--user-bubble);
    color: var(--user-text);
    border-start-end-radius:4px;
  }

  .msg .project-name{
    display:block;
    font-family: var(--font-mono);
    font-size:12.5px;
    color: var(--accent);
    margin-bottom:4px;
  }

  .typing{
    align-self:flex-start;
    display:flex;
    gap:4px;
    padding:14px 16px;
    background: var(--panel);
    border:1px solid var(--line);
    border-radius: var(--radius);
    border-start-start-radius:4px;
  }

  .typing span{
    width:6px;
    height:6px;
    border-radius:50%;
    background: var(--ink-soft);
    opacity:.5;
    animation: blink 1.1s infinite;
  }

  .typing span:nth-child(2){ animation-delay: .18s; }
  .typing span:nth-child(3){ animation-delay: .36s; }

  @keyframes blink{
    0%, 80%, 100%{ opacity:.3; transform: scale(.85); }
    40%{ opacity:1; transform: scale(1); }
  }

  /* ---------- Suggestion chips ---------- */

  #chips{
    max-width:720px;
    margin:0 auto;
    width:100%;
    padding:8px 20px;
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
  }

  #chips::-webkit-scrollbar{ display:none; }

  .chip{
    flex-shrink:0;
    font-family: var(--font-fa);
    font-size:13.5px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    cursor:pointer;
    transition: border-color .15s, background .15s;
    white-space:nowrap;
  }

  .chip:hover,
  .chip:focus-visible{
    border-color: var(--accent);
    background: var(--accent-ink);
  }

  /* ---------- Composer ---------- */

  footer.composer{
    border-top:1px solid var(--line);
    background: var(--panel);
    padding:14px 20px 10px;
  }

  form#composer-form{
    max-width:720px;
    margin:0 auto;
    display:flex;
    gap:10px;
  }

  #text-input{
    flex:1;
    font-family: var(--font-fa);
    font-size:15px;
    padding:12px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    outline:none;
    transition: border-color .15s, box-shadow .15s;
  }

  #text-input:focus-visible{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ink);
  }

  #send-btn{
    font-family: var(--font-fa);
    font-weight:600;
    font-size:14.5px;
    padding:0 20px;
    border-radius:999px;
    border:none;
    background: var(--accent);
    color:#fff;
    cursor:pointer;
    transition: filter .15s, transform .1s;
  }

  #send-btn:hover{ filter: brightness(1.08); }
  #send-btn:active{ transform: scale(.97); }
  #send-btn:focus-visible{ outline: 2px solid var(--ink); outline-offset:2px; }

  .fine-print{
    text-align:center;
    font-family: var(--font-mono);
    font-size:11.5px;
    color: var(--ink-soft);
    padding:10px 0 2px;
  }

  .fine-print span{ margin: 0 6px; }

  /* ---------- Mobile ---------- */

  @media (max-width: 480px){
    header.top{ padding:12px 14px; }
    #chat{ padding:18px 14px 10px; }
    #chips{ padding:6px 14px; }
    form#composer-form{ padding:0; }
    footer.composer{ padding:12px 14px 8px; }
    .msg{ max-width:88%; font-size:14.5px; }
  }

  @media (prefers-reduced-motion: reduce){
    .msg{ animation:none; }
    .typing span{ animation:none; opacity:.6; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="avatar">ط‌ک</div>
  <div class="top-info">
    <h1>دستیار هوشمند طاها کریمی</h1>
    <div class="status"><span class="dot"></span> آماده‌ی پاسخ‌گویی</div>
  </div>
  <nav class="top-links" aria-label="راه‌های ارتباطی">
    <a href="mailto:taha.01.karimi@gmail.com" title="ایمیل" aria-label="ارسال ایمیل">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18v12H3z"/><path d="M3 7l9 6 9-6"/></svg>
    </a>
    <a href="tel:09026324574" title="تماس تلفنی" aria-label="تماس تلفنی">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5c0 8 7 15 15 15l3-4-6-3-2 2c-2-1-4-3-5-5l2-2-3-6z"/></svg>
    </a>
    <a href="https://instagram.com/taha0246titi" target="_blank" rel="noopener" title="اینستاگرام" aria-label="پیج اینستاگرام">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>

  </nav>
</header>

<main class="chat-wrap">
  <div id="chat" role="log" aria-live="polite"></div>
</main>

<div id="chips"></div>

<footer class="composer">
  <form id="composer-form">
    <input id="text-input" type="text" autocomplete="off" placeholder="پیامت رو بنویس…" aria-label="پیام">
    <button id="send-btn" type="submit">ارسال</button>
  </form>
  <p class="fine-print">taha.01.karimi@gmail.com <span>·</span> 09026324574 <span>·</span> @taha0246titi</p>
</footer>

<script>
// =========================================================
//   داده‌های پروفایل و نمونه‌کارها (همسان با نسخه‌ی پایتون)
// =========================================================

const PROFILE = {
  name: "طاها کریمی",
  intro: "برنامه‌نویس فرانت‌اند و بک‌اند با تسلط بر پایتون و زبان‌های فرانت‌اند",
  skills: [
    "پایتون (بک‌اند / اسکریپت‌نویسی / اتوماسیون)",
    "اچ‌تی‌ام‌ال، سی‌اس‌اس، جاوااسکریپت (فرانت‌اند)",
    "توسعه‌ی کامل وب (فول‌استک)",
    "کار با ای‌پی‌آی‌ها و کتابخانه‌های دانلود رسانه",
  ],
  email: "taha.01.karimi@gmail.com",
  phone: "09026324574",
  instagram: "@taha0246titi",
};

const PROJECTS = [
  { name: "محاسبه‌گر سن", desc: "برنامه‌ای که با گرفتن تاریخ تولد کاربر، سن دقیق (سال/ماه/روز) را محاسبه و نمایش می‌دهد.", tech: ["پایتون", "اچ‌تی‌ام‌ال/سی‌اس‌اس/جاوااسکریپت برای نسخه‌ی وب"] },
  { name: "فروشگاه اینترنتی", desc: "یک وب‌سایت فروشگاهی کامل شامل نمایش محصولات، سبد خرید، ثبت سفارش و پنل مدیریت ساده.", tech: ["پایتون (بک‌اند)", "اچ‌تی‌ام‌ال/سی‌اس‌اس/جاوااسکریپت (فرانت‌اند)", "دیتابیس"] },
  { name: "دانلودر ویدیو و موزیک (اینستاگرام و یوتیوب)", desc: "ابزاری که با گرفتن لینک پست/ویدیوی اینستاگرام یا یوتیوب، فایل ویدیو یا صدا را استخراج و دانلود می‌کند.", tech: ["پایتون", "کتابخانه‌ی yt-dlp و requests", "رابط کاربری ساده"] },
  { name: "مبدل واحدها", desc: "تبدیل سریع واحدهای طول، وزن، دما و ارز بین یکدیگر با یک رابط ساده.", tech: ["پایتون"] },
  { name: "برنامه یادداشت و کارها (لیست کارها)", desc: "مدیریت کارهای روزانه با امکان افزودن، حذف، ویرایش و علامت‌گذاری کارهای انجام‌شده.", tech: ["پایتون", "اچ‌تی‌ام‌ال/سی‌اس‌اس/جاوااسکریپت برای نسخه‌ی وب"] },
  { name: "تولیدکننده رمز عبور امن", desc: "ساخت رمزهای عبور تصادفی و قوی با قابلیت تعیین طول و نوع کاراکترها.", tech: ["پایتون"] },
  { name: "کوتاه‌کننده لینک", desc: "تبدیل لینک‌های طولانی به لینک‌های کوتاه قابل اشتراک‌گذاری.", tech: ["پایتون (بک‌اند)", "اچ‌تی‌ام‌ال/سی‌اس‌اس/جاوااسکریپت (فرانت‌اند)"] },
];

const GREETINGS = [
  `سلام! خوش اومدی 👋 من دستیار هوشمند ${PROFILE.name} هستم. چطور می‌تونم کمکت کنم؟`,
  "سلام، حالت چطوره؟ می‌تونی درباره‌ی مهارت‌ها، نمونه‌کارها یا راه‌های تماس ازم بپرسی.",
  "درود بر تو! خوشحالم که اینجایی. بگو دنبال چه اطلاعاتی هستی.",
];

const HOW_ARE_YOU = [
  "ممنون، من همیشه آماده‌ام کمک کنم! خودت چطوری؟",
  "عالی‌ام، مرسی که پرسیدی! تو چطوری؟",
];

const KEYWORDS = {
  greeting: ["سلام", "درود", "های", "هلو", "hi", "hello", "hey", "صبح بخیر", "ظهر بخیر", "عصر بخیر", "شب بخیر"],
  how_are_you: ["چطوری", "حالت چطوره", "خوبی", "چه خبر", "احوالت", "اوضاع چطوره"],
  thanks: ["ممنون", "مرسی", "تشکر", "دمت گرم", "دستت درد نکنه"],
  name: ["اسم", "اسمت", "اسمتو", "نام", "کی هستی", "خودتو معرفی", "معرفی کن", "تو کی هستی"],
  skills: ["مهارت", "مهارتت", "مهارتهات", "مهارتهاتو", "مهارتات", "بلدی", "تخصص", "تخصصت", "زبان برنامه نویسی", "چیکاره ای"],
  email: ["ایمیل", "ایمیلت", "ایمیلتو", "email", "میل"],
  phone: ["شماره", "تلفن", "تماس", "شماره تماس", "شماره موبایل"],
  instagram: ["اینستا", "instagram", "اینستاگرام", "پیج"],
  contact: ["ارتباط", "تماس با من", "چطور باهام تماس", "راه ارتباطی"],
  projects_list: ["نمونه کار", "پروژه", "پروژه ها", "نمونه کارها", "کارهات چیه", "چیکار کردی", "چی ساختی", "چی طراحی کردی", "کارهاتو", "کارهات", "پروژه هات", "پروژه هاتو"],
  help: ["راهنما", "کمک", "چی میتونی", "دستورات"],
};

const PROJECT_STOPWORDS = new Set(["برنامه", "لیست", "کارها", "یادداشت", "و", "امن"]);

// =========================================================
//                     منطق تشخیص هدف
// =========================================================

function normalize(text){
  return text.trim().toLowerCase().replace(/\s+/g, " ").replace(/ي/g, "ی").replace(/ك/g, "ک").replace(/‌/g, " ");
}

function wordMatch(keyword, text){
  const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = new RegExp("(?<![\\p{L}\\p{N}_])" + escaped + "(?![\\p{L}\\p{N}_])", "u");
  return re.test(text);
}

function matchIntent(raw){
  const text = normalize(raw);

  for(const project of PROJECTS){
    const words = normalize(project.name).split(" ");
    for(const w of words){
      const word = w.replace(/[()،]/g, "");
      if(word.length > 2 && !PROJECT_STOPWORDS.has(word) && wordMatch(word, text)){
        return { type: "project_detail", project };
      }
    }
  }

  for(const intent in KEYWORDS){
    for(const kw of KEYWORDS[intent]){
      if(wordMatch(normalize(kw), text)) return { type: intent };
    }
  }

  return { type: "unknown" };
}

function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function respond(raw){
  const intent = matchIntent(raw);

  switch(intent.type){
    case "project_detail": {
      const p = intent.project;
      return { html: `<span class="project-name">${p.name}</span>${p.desc}\n\nتکنولوژی‌ها: ${p.tech.join("، ")}` };
    }
    case "greeting": return { text: pick(GREETINGS) };
    case "how_are_you": return { text: pick(HOW_ARE_YOU) };
    case "thanks": return { text: "خواهش می‌کنم! هر وقت سؤال دیگه‌ای داشتی بپرس 🙂" };
    case "name": return { text: `سلام! من دستیار هوشمند ${PROFILE.name} هستم. ${PROFILE.intro}.` };
    case "skills": return { text: `مهارت‌های ${PROFILE.name}:\n` + PROFILE.skills.map(s => "• " + s).join("\n") };
    case "email": return { text: `ایمیل: ${PROFILE.email}` };
    case "phone": return { text: `شماره تماس: ${PROFILE.phone}` };
    case "instagram": return { text: `پیج اینستاگرام: ${PROFILE.instagram}` };
    case "contact": return { text: `راه‌های ارتباطی:\n• ایمیل: ${PROFILE.email}\n• تلفن: ${PROFILE.phone}\n• اینستاگرام: ${PROFILE.instagram}` };
    case "projects_list": {
      const list = PROJECTS.map((p, i) => `${i+1}. ${p.name}`).join("\n");
      return { text: `نمونه‌کارهای من:\n${list}\n\nبرای جزئیات بیشتر، اسم پروژه رو بنویس (مثلاً: «فروشگاه اینترنتی»).` };
    }
    case "help": return { text: helpText() };
    default: return { text: "دقیق متوجه منظورت نشدم 🤔 ولی می‌تونی یکی از این‌ها رو امتحان کنی:\n• «سلام» یا «چطوری؟»\n• «مهارت‌هات چیه؟»\n• «نمونه کارهاتو نشونم بده»\n• «شماره تماس» یا «اینستاگرامت چیه؟»" };
  }
}

function helpText(){
  return "می‌تونی از من درباره موارد زیر بپرسی:\n• سلام/احوال‌پرسی\n• معرفی خودم\n• مهارت‌ها\n• ایمیل، شماره تماس، اینستاگرام\n• لیست نمونه‌کارها یا جزئیات یک پروژه‌ی خاص";
}

// =========================================================
//                        رابط کاربری
// =========================================================

const chatEl = document.getElementById("chat");
const formEl = document.getElementById("composer-form");
const inputEl = document.getElementById("text-input");
const chipsEl = document.getElementById("chips");

function addMessage(role, content){
  const div = document.createElement("div");
  div.className = "msg " + role;
  if(content.html) div.innerHTML = content.html;
  else div.textContent = content.text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function showTyping(){
  const div = document.createElement("div");
  div.className = "typing";
  div.id = "typing-indicator";
  div.innerHTML = "<span></span><span></span><span></span>";
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function hideTyping(){
  const el = document.getElementById("typing-indicator");
  if(el) el.remove();
}

let conversationHistory = []; // [{role: 'user'|'model', content: '...'}]
let backendAvailable = true;

async function askBackend(message){
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message, history: conversationHistory }),
  });
  if(!res.ok) throw new Error("backend error");
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data.reply;
}

async function sendMessage(text){
  if(!text.trim()) return;
  addMessage("user", { text });
  inputEl.value = "";
  showTyping();

  let replyText;
  try{
    if(!backendAvailable) throw new Error("skip");
    replyText = await askBackend(text);
    conversationHistory.push({ role: "user", content: text });
    conversationHistory.push({ role: "model", content: replyText });
  }catch(err){
    backendAvailable = false; // این نشست دیگه سراغ بک‌اند نره، مستقیم محلی جواب بده
    await new Promise(r => setTimeout(r, 350 + Math.random() * 250));
    const local = respond(text);
    replyText = local.html ? local : { text: local.text };
  }

  hideTyping();
  if(typeof replyText === "string") addMessage("bot", { text: replyText });
  else addMessage("bot", replyText);
}

formEl.addEventListener("submit", e => {
  e.preventDefault();
  sendMessage(inputEl.value);
});

const CHIP_LABELS = ["سلام", "مهارت‌هات چیه؟", "نمونه کارهاتو نشونم بده", "راه‌های تماس"];
CHIP_LABELS.forEach(label => {
  const btn = document.createElement("button");
  btn.className = "chip";
  btn.type = "button";
  btn.textContent = label;
  btn.addEventListener("click", () => sendMessage(label));
  chipsEl.appendChild(btn);
});

// پیام خوش‌آمد اولیه
addMessage("bot", { text: pick(GREETINGS) });
</script>
</body>
</html>
